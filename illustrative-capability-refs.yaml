# Capability refs this site publishes that NO producer in the platform publishes.
#
# Enforced by `tooling/boundaries/check-docs-capability-refs.mjs` in the
# xema-monorepo aggregator (`pnpm run check:docs-capability-refs`). That check
# reads every `<domain>:<name>@<major>` printed under `content/` and `src/` and
# requires each one to be produced somewhere in code — an authorization-api seed,
# `INITIAL_CAPABILITY_SEED`, a `*.capability.contribution.json`, a
# `@XemaCapability` decorator or ref table, a manifest's `exposesCapabilities`,
# a Shell built-in, or a public HTTP route annotated so the ref is DERIVED at
# boot. Anything else must be declared here, or the gate fails.
#
# WHY A SIDECAR AND NOT AN INLINE MARKER
# --------------------------------------
# This repository publishes externally, and `content/**` is served as raw
# Markdown to renderers this repo does not own — an HTML comment is invisible in
# some and printed verbatim in others. A frontmatter key was the other candidate
# and does not work either: ~15 content files have no frontmatter at all, and two
# of them (`content/xema-os/xema-os-shell.md`, `content/xema-os/cli.md`) are among the
# heaviest ref users. A sidecar changes no published byte.
#
# TWO CATEGORIES, DELIBERATELY SEPARATE
# -------------------------------------
#   illustrative: invented to teach. No producer will ever exist and none is
#                 owed. `hello:greet@1` is the canonical case.
#   unpublished:  named as a REAL capability — by this site and usually by the
#                 platform's own contracts and API descriptions too — and
#                 produced by nothing. That is a debt, so each entry must say
#                 what is `owed:`, and the gate prints the whole list on every
#                 successful run.
#
# Both are scoped by `files:`. The same string on a page that did not invent it
# is a different claim and may well be a typo for a real ref, so a declaration
# never silences a ref site-wide. Entries go STALE and fail when the ref gains a
# producer, disappears from the docs, or leaves one of its listed files.

illustrative:
  hello:greet@1:
    reason: >-
      The capability the "hello biome" tutorial scaffolds and then invokes. It is the worked example
      the getting-started page builds from scratch, so a producer in this platform would defeat the
      exercise.
    files:
      - content/xema-os/cli.md
      - content/xema-os/sdk/getting-started.md

  my-domain:thing@2:
    reason: >-
      Demonstrates a MAJOR version bump — it is the only `@2` on the site and exists to show that a
      v2 ref is declared alongside its v1. `my-domain:` is a placeholder domain.
    files:
      - content/xema-os/xema-os-versioning.md

  github-mcp:create-issue@1:
    reason: >-
      Written immediately after the abstract grammar `<provider-id>:<tool-name>@1` and introduced by
      "e.g." — it illustrates how an MCP tool NAME is translated into a ref, not a ref Xema ships.
      The real shipped ref for that path is `mcp-tool:invoke@1`.
    files:
      - content/xema-os/mcp-and-capabilities.md

  mcp-tool:sonarqube.read@1:
    reason: >-
      Same translated-MCP-tool family as `github-mcp:create-issue@1`, used to show a composition node
      attaching a third-party tool. SonarQube is not a Xema integration; `mcp-tool:invoke@1` is the
      ref that actually exists.
    files:
      - content/xema-os/agent-composition/01-concepts.md

  biome:incidents.list@1:
    reason: >-
      Introduced by "e.g." inside the cross-biome data-access procedure, standing for whatever read
      capability a reader's own source biome would expose. There is no incidents biome.
    files:
      - content/xema-os/sdk/storage.md

  biome:acme.support.ingestor.write@1:
    reason: >-
      `acme.support` is this site's standing fictional tenant biome, used to show what a
      biome-shipped backend's own capability namespace looks like once it is installed.
    files:
      - content/xema-os/sdk/backend-i-ship.md

  biome:acme.support.ingestor.read@1:
    reason: >-
      Second verb of the same fictional `acme.support` biome — the read side of the ingestor the
      backend-authoring page walks through.
    files:
      - content/xema-os/sdk/backend-i-ship.md

  biome:acme.support.renderer.execute@1:
    reason: >-
      Third verb of the same fictional `acme.support` biome, showing a second component in one
      biome's namespace.
    files:
      - content/xema-os/sdk/backend-i-ship.md

  connector:bank.transfer@1:
    reason: >-
      The site's standing fictional HIGH-RISK capability, used on two pages to make execution-context
      scoping and the capability-vs-MCP-tool distinction concrete. Every use is prefixed "Example:" /
      "Worked example:". Xema ships no banking connector, and the only occurrence in code is a policy
      TEST fixture (authorization-api `policies/xema_test.rego`).
    files:
      - content/xema-os/execution-contexts.md
      - content/xema-os/mcp-and-capabilities.md

unpublished:
  xema:object.write@1:
    reason: >-
      The gate `xema-shell-api` really does enforce on `POST /xvfs/write`: `XVFS_WRITE_CAPABILITY` in
      `src/xvfs/xvfs.service.ts` is this exact string, it is the `ref` sent to `xema-capability-router`
      on every XVFS upsert, and a denial is what produces the documented `XVFS_WRITE_DENIED` (403).
      The same name is printed in that route's OpenAPI description and in the generated client. So the
      sentence is true about the platform's behaviour — but no producer publishes the ref: the `xema:`
      domain has no seed row, no `INITIAL_CAPABILITY_SEED` entry, no contribution, no
      `@XemaCapability` decorator (`xvfs.service.ts` carries none), and the route's own DERIVED ref is
      `xema-shell:xvf.write.create@1`, which is a different name for a different thing — the ref that
      admits the HTTP call, not the ref the handler then checks against the object being written.
    owed: >-
      Publish `xema:object.write@1` from whichever service owns the XemaObject write plane — the
      natural home is `object-registry-api`, since the ref names an OBJECT verb rather than a Shell
      one — or, if the gate is meant to be the Shell's, rename the constant, the OpenAPI description,
      the generated client and this page to a ref that is actually published. Until then no grant can
      be authored for the ref the router is asked about, so every XVFS write depends on how the router
      resolves a ref its registry has never seen. Correcting these docs alone would leave them
      disagreeing with the service's own error contract, which is why this is recorded rather than
      rewritten here.
    files:
      - content/xema-os/objects.md

  xema-shell:run@1:
    reason: >-
      The agent-facing Shell dispatch surface. This is NOT a docs typo — the platform names the same
      ref in its own contracts and wire descriptions (`kernel-contracts` shell-command-descriptor,
      `xema-shell-api` shell-run.dto.ts, its `openapi.public.json`, and both generated clients) — but
      every one of those is prose. No producer publishes it: the Shell's built-in verbs are registered
      as `shellCap('<verb>')` and there is no `run` verb, and the `POST /shell/run` route derives
      `xema-shell:shell.run.run@1` instead.
    owed: >-
      Publish `xema-shell:run@1` from xema-shell-api (a `@XemaCapability` on the dispatch handler, which
      also wins over the derived ref), or rename every mention across the kernel contract, the DTO, the
      OpenAPI description and these docs to the ref that is actually published. Renaming the docs alone
      would make them disagree with the platform's own contracts, which is why this is recorded rather
      than "fixed" here.
    files:
      - content/xema-os/xema-os-shell.md
      - content/xema-os/concepts/xema-shell.md

  biome-storage:collection.write@1:
    reason: >-
      The write half of the biome-storage SDK surface. Documented with copy-pasteable
      `ctx.callCapability(...)` samples and a `requiresCapabilities[]` declaration, and routed in the
      prose to `biome-storage-api` — a service the aggregator's own CLAUDE.md records as one of three
      the charter names but that does not exist. Nothing produces the ref.
    owed: >-
      Ship biome-storage-api and publish the ref, or mark the storage SDK pages as not-yet-available so
      a reader does not build against a capability that cannot resolve. Deleting the pages is not the
      fix — they describe an intended surface, and the samples would have to be rewritten by whoever
      owns it, not removed by a gate.
    files:
      - content/xema-os/sdk/storage.md
      - content/xema-os/sdk/testing.md

  biome-storage:collection.read@1:
    reason: >-
      The read half of the same unbuilt biome-storage SDK surface, documented in the same capability
      table as its write sibling.
    owed: >-
      Same as `biome-storage:collection.write@1` — ship the service and publish the ref, or mark the
      surface not-yet-available. The two must move together; a table listing one and not the other is
      worse than either.
    files:
      - content/xema-os/sdk/storage.md

  org-db:database.create@1:
    reason: >-
      Presented as a capability GATE on org-database provisioning, and described as "held exclusively
      by platform internals". The `org-db` domain has no producer of any kind — no seed, no
      contribution, no decorator, no annotated public route. The nearest real thing is the
      authorization-api seed row `org_database:provision`, which is a different id space (snake_case,
      no `@major`) and not a capability ref.
    owed: >-
      Publish the org-db capability family from org-database-pool-api, or rewrite the provisioning
      table to name the authorization rows that actually gate it. Until then the table describes gates
      that cannot be granted.
    files:
      - content/databases/02-provisioning.md

  org-db:database.use@1:
    reason: >-
      Documented as the capability a biome declares to read and write its own schema, and as something
      granted at install time via `BiomeInstallGrant`. Named only in the `org-db-explorer` MCP catalog
      TOOL DESCRIPTIONS, which are prose, not a declaration. No producer.
    owed: >-
      Publish it with the rest of the org-db family, or correct the provisioning table. This one is the
      most load-bearing of the three — an author following the page will declare it in a manifest and
      the install grant will have nothing to bind.
    files:
      - content/databases/02-provisioning.md

  org-db:database.migrate@1:
    reason: >-
      The migration gate of the same unpublished org-db family, declared by biomes alongside
      `org-db:database.use@1` per the same paragraph. Named only in MCP catalog tool description prose.
    owed: >-
      Publish it with the rest of the org-db family, or correct the provisioning table. It moves with
      `org-db:database.use@1`; the docs grant them together.
    files:
      - content/databases/02-provisioning.md

  connector:docs.publish-page@1:
    reason: >-
      One of the six refs the "1B pilot capability set" names as the canonical example of what a
      connector ships. It was declared in the platform's own contracts until 2026-08-18, in
      `kernel-contracts` `connector/lib/capability-refs.ts` — a table deleted as unreachable code,
      which it was: not re-exported from the `connector` barrel, referenced nowhere in `src`, and
      unresolvable through the `"./*": "./dist/*/index.js"` wildcard. Unreachable to a COMPILER and
      load-bearing for these docs, which is how the deletion left the claim standing with nothing
      behind it. Three of the six pilot refs shipped real producers; this is one of the three that
      did not.
    owed: >-
      Build the docs connector and publish the ref, or drop it from the pilot set in
      `capabilities.md` and `connectors.md`. It moves with `connector:chat.send-message@1` and
      `connector:llm.invoke@1` — the same table declared all three and the same paragraph advertises
      them.
    files:
      - content/xema-os/xema-os-capabilities.md
      - content/xema-os/connectors.md

  connector:chat.send-message@1:
    reason: >-
      Same 1B pilot set and the same deleted contracts table as `connector:docs.publish-page@1`. It
      additionally appears in the SDK testing guide as the subject of a handler unit test, asserting
      `callCapability` was called with it — there the ref is the example's subject rather than a
      claim that Xema ships it, but it is the same name and the same debt, so it is declared once
      here rather than split across two categories.
    owed: >-
      "Build the chat connector and publish this ref" is NOT one of the available remedies here, and
      that is measured rather than assumed: `connector-slack` already ships the outbound send
      action, and its adapter module records why the ref that action projects is
      `connector:slack.send@1` and not this name. Two structural reasons, both in the platform's own
      connector ref grammar (`<provider>.<verb>`): the native executor derives the ACTION SLUG from
      the ref's VERB, so `send-message` resolves to an action that does not exist — a 404 at first
      use; and `ConnectorRegistryService.findOperationByCapabilityRef` is keyed by the ref ALONE, so
      a `chat.*` ref shared by every conversation connector would make two installed chat connectors
      shadow each other. So the remedy is either a registry change that can disambiguate a
      provider-neutral ref, or rewriting the pilot set (and the testing example) around the
      provider-scoped refs that exist. It still moves with the other two — one table declared all
      three — but its first remedy is not the same one.
    files:
      - content/xema-os/xema-os-capabilities.md
      - content/xema-os/connectors.md
      - content/xema-os/sdk/testing.md

  connector:llm.invoke@1:
    reason: >-
      The third of the 1B pilot refs from the same deleted table. Note this is NOT the LLM gateway:
      first-party LLM traffic egresses through `llm-gateway-api`, which publishes no
      `connector:`-domain ref. Nothing in the fleet produces this name.
    owed: >-
      Build the connector and publish the ref, or drop it from the pilot set. Moves with the other
      two.
    files:
      - content/xema-os/xema-os-capabilities.md
      - content/xema-os/connectors.md

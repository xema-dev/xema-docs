# Build + push the `docs-api` container image.
#
# WHY THIS FILE EXISTS
#
#   `docs-api` is a real, deployed service: it has a chart
#   (`charts/docs-api` in xema-deploy), it is `enabled: true` in four
#   deployments, and every distribution edition's `images.lock.json` names it
#   as a subject at `ghcr.io/xema-dev/docs-api:<contentHash>`. Nothing in this
#   repository ever built it. The last image in that GHCR package was pushed on
#   2026-06-14 by a workflow that no longer exists — the repository kept only
#   `deploy-pages.yaml` (the Astro marketing site, a completely different
#   artifact) after it went public.
#
#   So a lock promised an image nothing produced, and an appliance install
#   would have failed pulling it. This closes that.
#
# WHAT `docs-api` IS
#
#   The zero-dependency Node content server at `service/server.mjs`, serving
#   the markdown bundle in `content/`. The root `Dockerfile` COPYs exactly those
#   two directories onto `node:22-slim` — no build step, no npm install. The
#   Astro site under `src/` is NOT part of this image; it ships to GitHub Pages
#   via `deploy-pages.yaml`.
#
# RUNNERS AND CREDENTIALS — both are forced, not preferences.
#
#   `ubuntu-latest`, not `[self-hosted, linux]`: this repository is PUBLIC and
#   the org self-hosted runner group has `allows_public_repositories: false`,
#   so a self-hosted job here queues forever and is never scheduled. Same
#   constraint `deploy-pages.yaml` documents.
#
#   `secrets.GH_PACKAGES_TOKEN`, not `github.token`: the `docs-api` GHCR
#   package is linked to `xema-dev/xema-platform`, not to this repository, so
#   this repo's run-scoped `GITHUB_TOKEN` has no write access to it even with
#   `packages: write` — the push would fail `403` on the blob HEAD request.
#   The PAT already holds it. The secret is configured on this repository.
#   Workflow-triggering is limited to `push` on `main` and `workflow_dispatch`,
#   neither of which a fork can cause, so the secret is never exposed to
#   untrusted code.
#
# WHAT THIS DOES: builds, attests, and hands the coordinate to xema-deploy.
#
#   `docs-api` is now a full `xema.deploy-service/v3` producer, so a push to
#   main builds the image, signs it, attests it, and dispatches a deploy. Before
#   that last part the image was built and pushed and then nothing carried it
#   anywhere — the deployed revision moved only when an operator or a reconcile
#   happened to re-apply it, so main and the cluster diverged silently.
#
#   It was onboarded in two steps, in this order, on purpose:
#
#   1. The THREE attestations the v3 contract verifies (SLSA provenance, SBOM,
#      Xema source binding). This workflow previously produced none — it built
#      with `provenance: false` and only `cosign sign`ed the image, which proves
#      "this workflow pushed it" and nothing about how it was built or what is
#      in it.
#   2. The producer profile in xema-deploy, and only after a green run had
#      demonstrated all three attestations VERIFY against the exact certificate
#      identity the gate pins.
#
#   That order is the whole point. A producer profile is a FENCE, and a fence
#   landing ahead of proof that its caller can satisfy it turns every subsequent
#   push red — which is the failure this fleet hit repeatedly on 2026-08-02.
#
#   The image lands at its lock coordinate regardless of the deploy, which is
#   what an appliance install resolves.
name: Build docs-api image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # QUEUE, never cancel. This repository builds ONE image and every run
  # rebuilds it in full, so a cancelled run costs nothing a later run does not
  # redo — but the content coordinate is content-addressed, and a cancelled run
  # can leave `:<contentHash>` unpublished for source that no later push
  # touches. Queueing is the cheap side of that trade.
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # Keyless cosign exchanges this job's OIDC token at Fulcio for a short-lived
  # signing certificate. Without `id-token: write` there is no token to exchange
  # and the signing step below fails.
  id-token: write

env:
  REGISTRY: ghcr.io
  REGISTRY_ORG: xema-dev
  SERVICE: docs-api

  # ─────────────────────────────────────────────────────────────────────────
  # Attestation contract — ONE definition per value, mirroring
  # xema-base/.github/workflows/build-and-dispatch.yaml so the two producers
  # cannot drift.
  # ─────────────────────────────────────────────────────────────────────────
  #
  # BuildKit is pinned to an exact release because the provenance PREDICATE
  # VERSION is a property of the BuildKit build, not of cosign: BuildKit
  # v0.28.0 switched the default SLSA provenance format from v0.2 to v1.0
  # (moby/buildkit#6526). An unpinned BuildKit therefore silently changes the
  # predicate shape under a fixed jq filter and a fixed cosign `--type`.
  # v0.31.2 is >= v0.28.0, so it emits SLSA v1.0; `version=v1` is ALSO passed
  # explicitly on the build so the pin's default can never become load-bearing.
  BUILDKIT_IMAGE: moby/buildkit:v0.31.2
  SLSA_PROVENANCE_VERSION: v1
  # `slsaprovenance1` is cosign's v1.0 alias. Plain `slsaprovenance` maps to
  # SLSA v0.2, which would unmarshal a v1 predicate into the v0.2 struct and
  # drop every field — an attestation that claims v0.2 and contains nothing.
  COSIGN_SLSA_PREDICATE_FLAG: slsaprovenance1
  COSIGN_SBOM_PREDICATE_FLAG: spdxjson
  SOURCE_BINDING_PREDICATE_TYPE: https://xema.dev/attestations/deploy-source/v1
  ATTESTATION_OIDC_ISSUER: https://token.actions.githubusercontent.com

  # Deploy hand-off. Value-identical to xema-base's, because xema-deploy
  # compares these against its own constants and a drift is refused, not
  # tolerated.
  DEPLOY_REPO: xema-dev/xema-deploy
  DEPLOY_TARGET: xema-prod
  DEPLOY_SERVICE_PAYLOAD_VERSION: xema.deploy-service/v3

jobs:
  build:
    name: Build & push docs-api
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The content hash reads the COMMIT's git objects. Full history keeps
          # that read independent of how the runner happened to fetch.
          fetch-depth: 0

      # A Node toolchain for the content-tag script below, so it does not
      # depend on whatever node the runner image happens to ship.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # The manifest is the reviewed declaration of what this repo produces, and
      # xema-deploy's producer contract is checked against it. The env literals
      # above say the same thing a second time, so they can drift from it — and a
      # drift would be silent: the image would build and push under one name
      # while the signed source binding hashed a manifest naming another.
      #
      # One assertion removes that. It is cheap, it runs before anything is
      # pushed, and it is the reason the manifest can be called the single
      # declaration rather than one of two.
      - name: Assert the env matches the declared build universe
        env:
          MANIFEST: tooling/release/deploy-services-manifest.json
        run: |
          set -euo pipefail
          IMAGE="$(printf '%s' "${REGISTRY}/${REGISTRY_ORG}/${SERVICE}" \
            | tr '[:upper:]' '[:lower:]')"
          COUNT="$(jq '.services | length' "${MANIFEST}")"
          if [ "${COUNT}" != "1" ]; then
            echo "::error::${MANIFEST} declares ${COUNT} services; this workflow builds exactly one."
            echo "::error::Adding a service means teaching this workflow to build it AND adding it to xema-deploy's producer contract."
            exit 1
          fi
          DECLARED_SERVICE="$(jq -r '.services[0].service' "${MANIFEST}")"
          DECLARED_IMAGE="$(jq -r '.services[0].imageRepository' "${MANIFEST}")"
          DECLARED_REPO="$(jq -r '.sourceRepository' "${MANIFEST}")"
          [ "${DECLARED_SERVICE}" = "${SERVICE}" ] || {
            echo "::error::${MANIFEST} declares service '${DECLARED_SERVICE}', workflow builds '${SERVICE}'."; exit 1; }
          [ "${DECLARED_IMAGE}" = "${IMAGE}" ] || {
            echo "::error::${MANIFEST} declares image '${DECLARED_IMAGE}', workflow pushes '${IMAGE}'."; exit 1; }
          [ "${DECLARED_REPO}" = "${GITHUB_REPOSITORY}" ] || {
            echo "::error::${MANIFEST} declares sourceRepository '${DECLARED_REPO}', this is '${GITHUB_REPOSITORY}'."; exit 1; }
          echo "::notice::Build universe agrees: ${DECLARED_SERVICE} -> ${DECLARED_IMAGE} from ${DECLARED_REPO}."

      - name: Compute image coordinates
        id: img
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="$(printf '%s' "${REGISTRY}/${REGISTRY_ORG}/${SERVICE}" \
            | tr '[:upper:]' '[:lower:]')"
          # ─────────────────────────────────────────────────────────────────
          # THE CONTENT-ADDRESSED RELEASE COORDINATE.
          #
          # Every distribution's images.lock.json names this image as
          # `<imageRef>:<contentHash>` — `deliver-images.mjs` calls it the
          # "source tag", and its `shared` delivery mode entitles a customer
          # pull token to exactly that ref with NO copy. All three delivery
          # modes assume the PRODUCER already pushed it.
          #
          # The hash has ONE owner (`compute-image-tag.mjs` →
          # `@xemahq/distribution-source-hash`); this workflow only consumes
          # it. Re-deriving it here would put the release coordinate on two
          # implementations that can silently disagree.
          #
          # `docs-api` is a WHOLE-REPO image, so the hashed path is the
          # repository root — the same path the lock's subject declares.
          # ─────────────────────────────────────────────────────────────────
          CONTENT_TAG="$(
            node tooling/release/compute-image-tag.mjs \
              --service "${SERVICE}" --path . --commit "${SHA}"
          )"
          # sha256 hex, exactly as `sourceHashAlgorithm:
          # xema-source-tree-sha256-v2` produces in the lock. A different shape
          # means the algorithm moved and the tag would NOT be the coordinate
          # the lock names — fail here, not at delivery time.
          case "${CONTENT_TAG}" in
            *[!0-9a-f]* | "")
              echo "::error::compute-image-tag.mjs emitted a non-hex tag for ${SERVICE}"
              exit 1
              ;;
          esac
          if [ "${#CONTENT_TAG}" -ne 64 ]; then
            echo "::error::compute-image-tag.mjs emitted a ${#CONTENT_TAG}-char tag for ${SERVICE}; expected 64 (sha256 hex)"
            exit 1
          fi
          {
            echo "image=${IMAGE}"
            echo "tag=${SHA}"
            echo "content_tag=${CONTENT_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          # Pin the BuildKit image: it, not cosign, decides which SLSA
          # provenance predicate version is emitted. See the BUILDKIT_IMAGE
          # comment in the workflow `env:` block.
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # NOT `github.token` — see the credentials note in the file header.
          password: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.img.outputs.image }}
          tags: |
            type=raw,value=${{ steps.img.outputs.tag }}
            # The distribution's deployable coordinate. The job runs on main
            # only (job-level `if`), which is what keeps this — and `latest`
            # below — off branch builds: an unreviewed build must never
            # repoint a coordinate a lock names.
            type=raw,value=${{ steps.img.outputs.content_tag }}
            type=raw,value=latest

      - name: Build & push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          # amd64-only here. `release-arm64.yaml` produces linux/arm64 AFTER
          # this run and merges both into a multi-arch index on the
          # `:<contentHash>` coordinate — it never rewrites `:${SHA}`.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=docs-api
          cache-to: type=gha,scope=docs-api,mode=max
          # Was `provenance: false`, which is why this image carried a
          # signature but no ATTESTATIONS — and a signature proves only "this
          # workflow pushed it", not how it was built or what is inside. The
          # `xema.deploy-service/v3` contract requires all three predicates, so
          # without these two lines `docs-api` could never become a producer.
          provenance: mode=max,version=${{ env.SLSA_PROVENANCE_VERSION }}
          sbom: true

      - name: Install pinned cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.3

      # The three predicates `xema.deploy-service/v3` requires. Extracted from
      # the image BuildKit just produced rather than re-derived, so what is
      # signed is what was actually built.
      #
      # Every `jq -e … | select(…)` below is an assertion, not a filter: a
      # predicate that does not match the expected shape yields empty output and
      # the following `test -s` fails the step. Silently attesting a
      # wrong-shaped predicate is worse than not attesting — it produces a
      # signature over nothing that a verifier accepts.
      - name: Export exact BuildKit provenance and SBOM predicates
        id: predicates
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SUBJECT="${IMAGE}@${DIGEST}"
          PROVENANCE_RAW="${RUNNER_TEMP}/${SERVICE}-${SOURCE_SHA}.provenance-raw.json"
          PROVENANCE="${RUNNER_TEMP}/${SERVICE}-${SOURCE_SHA}.slsa-provenance.json"
          SBOM="${RUNNER_TEMP}/${SERVICE}-${SOURCE_SHA}.spdx.json"
          SOURCE_BINDING="${RUNNER_TEMP}/${SERVICE}-${SOURCE_SHA}.xema-source-binding.json"

          docker buildx imagetools inspect "${SUBJECT}" \
            --format '{{json .Provenance}}' > "${PROVENANCE_RAW}"
          # `--format '{{json .Provenance}}'` renders `{"SLSA": <predicate>}`
          # for a SINGLE-platform subject and `{"<platform>": {"SLSA": …}}` once
          # the subject is a multi-platform index. Assert the single-platform
          # shape so adding a second platform to THIS job fails here instead of
          # silently attesting one platform's provenance as if it covered the
          # whole index. (`release-arm64.yaml` merges the index afterwards and
          # is a separate subject.)
          jq -e 'keys == ["SLSA"]' "${PROVENANCE_RAW}" >/dev/null
          # SLSA v1.0 field names (`buildDefinition` / `runDetails`), matching
          # the pinned BuildKit's emitted version. BuildKit records the VCS
          # revision in its v1 extension field
          # `runDetails.metadata.buildkit_metadata.vcs` — NOT
          # `runDetails.metadata.vcs`.
          jq -e --arg sha "${SOURCE_SHA}" \
              '.SLSA
               | select(.buildDefinition.buildType | type == "string")
               | select(.runDetails.metadata.buildkit_metadata.vcs.revision
                        == $sha)' \
            "${PROVENANCE_RAW}" > "${PROVENANCE}"

          docker buildx imagetools inspect "${SUBJECT}" \
            --format '{{json .SBOM}}' \
            | jq -e \
                '.SPDX
                 | select(.spdxVersion | startswith("SPDX-"))
                 | select(.packages | type == "array")' \
            > "${SBOM}"

          test -s "${PROVENANCE}"
          test -s "${SBOM}"

          # The Xema source binding — the only signed statement tying the
          # dispatch payload's own claims to the image digest.
          #
          # `deployServicesManifestSha256` hashes THE FILE, exactly as xema-base
          # hashes its generated one. An earlier revision hashed an equivalent
          # declaration assembled inline here, on the reasoning that this repo
          # had no manifest and the verifier treats the field opaquely. Both
          # halves were true and the result was still wrong: it created a SECOND
          # notion of "this repo's deploy-services manifest" that no checker
          # compared to the first, so the moment the real file landed for
          # xema-deploy's producer contract, the signed binding would have gone
          # on attesting a hash of something else. One file, one hash.
          #
          # `sha256sum` over the bytes on disk — not a canonicalised re-render —
          # so what is attested is what a reviewer reads and what the producer
          # contract is checked against.
          MANIFEST_SHA256="$(sha256sum tooling/release/deploy-services-manifest.json | cut -d' ' -f1)"
          jq -n \
            --arg service "${SERVICE}" \
            --arg sourceRepository "${GITHUB_REPOSITORY}" \
            --arg sourceRef "${GITHUB_REF}" \
            --arg sourceSha "${SOURCE_SHA}" \
            --arg deployServicesManifestSha256 "${MANIFEST_SHA256}" \
            --arg imageSubject "${SUBJECT}" \
            '{
              service: $service,
              sourceRepository: $sourceRepository,
              sourceRef: $sourceRef,
              sourceSha: $sourceSha,
              deployServicesManifestSha256: $deployServicesManifestSha256,
              imageSubject: $imageSubject
            }' > "${SOURCE_BINDING}"
          test -s "${SOURCE_BINDING}"

          {
            echo "provenance=${PROVENANCE}"
            echo "sbom=${SBOM}"
            echo "source_binding=${SOURCE_BINDING}"
            echo "manifest_sha256=${MANIFEST_SHA256}"
          } >> "$GITHUB_OUTPUT"

      # `docs-api` is a subject in the appliance distribution locks, and the
      # fleet's ClusterImagePolicy
      # (xema-control-plane/policy/cosign-policy.yaml, `xema-signed-images-docs`)
      # admits it only against a signature from this workflow or from
      # `release-arm64.yaml`. Without this step the amd64 manifest — the digest
      # `:<contentHash>` resolves to until the arm64 lane merges an index — is
      # unsigned, so the image is admitted only in the window AFTER arm64 lands.
      #
      # The job-level `if: github.ref == 'refs/heads/main'` is what keeps this
      # off branch builds; it is deliberately not re-stated here, so there is
      # one gate rather than two free to drift. The certificate identity is
      # `@${GITHUB_REF}`-bound anyway, so a branch signature could not satisfy
      # the main-pinned policy even if one were produced.
      - name: Keyless-sign and attest the image
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          CONTENT_TAG: ${{ steps.img.outputs.content_tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PROVENANCE: ${{ steps.predicates.outputs.provenance }}
          SBOM: ${{ steps.predicates.outputs.sbom }}
          SOURCE_BINDING: ${{ steps.predicates.outputs.source_binding }}
          OIDC_ISSUER: ${{ env.ATTESTATION_OIDC_ISSUER }}
        run: |
          set -euo pipefail
          if [[ ! "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::build produced an invalid digest '${DIGEST}'"
            exit 1
          fi
          SUBJECT="${IMAGE}@${DIGEST}"
          CERTIFICATE_IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build-image.yaml@${GITHUB_REF}"
          cosign sign --yes "${SUBJECT}"
          # The three MANDATORY predicates of `xema.deploy-service/v3`: the SLSA
          # provenance proves HOW the image was built, the SBOM proves WHAT is
          # in it, and the Xema source binding is the only signed statement
          # tying a dispatch payload's claims to this digest.
          cosign attest --yes \
            --type "${COSIGN_SLSA_PREDICATE_FLAG}" \
            --predicate "${PROVENANCE}" \
            "${SUBJECT}"
          cosign attest --yes \
            --type "${COSIGN_SBOM_PREDICATE_FLAG}" \
            --predicate "${SBOM}" \
            "${SUBJECT}"
          cosign attest --yes \
            --type "${SOURCE_BINDING_PREDICATE_TYPE}" \
            --predicate "${SOURCE_BINDING}" \
            "${SUBJECT}"
          # Re-assert HERE, in the producing run: a signature that does not
          # verify against the exact identity the policy pins is worth nothing,
          # and an appliance install is far too late to find that out. The same
          # applies to each attestation — an unverifiable one would only be
          # discovered by the deploy gate refusing every future dispatch.
          cosign verify \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            --certificate-github-workflow-repository "${GITHUB_REPOSITORY}" \
            --certificate-github-workflow-ref "${GITHUB_REF}" \
            --certificate-github-workflow-sha "${GITHUB_SHA}" \
            "${SUBJECT}" >/dev/null
          for PREDICATE_TYPE in \
            "${COSIGN_SLSA_PREDICATE_FLAG}" \
            "${COSIGN_SBOM_PREDICATE_FLAG}" \
            "${SOURCE_BINDING_PREDICATE_TYPE}"; do
            cosign verify-attestation \
              --certificate-identity "${CERTIFICATE_IDENTITY}" \
              --certificate-oidc-issuer "${OIDC_ISSUER}" \
              --certificate-github-workflow-repository "${GITHUB_REPOSITORY}" \
              --certificate-github-workflow-ref "${GITHUB_REF}" \
              --certificate-github-workflow-sha "${GITHUB_SHA}" \
              --type "${PREDICATE_TYPE}" "${SUBJECT}" >/dev/null
          done
          echo "::notice::${SUBJECT} is keyless-signed and carries all three v3 attestations as ${CERTIFICATE_IDENTITY}."

      # Hand the freshly-built coordinate to xema-deploy, which owns the deploy.
      #
      # This is what makes `docs-api` stop drifting behind main. Before it, the
      # image was built and pushed and then nothing carried it anywhere: the
      # deployed revision moved only when an operator or a reconcile happened to
      # re-apply it, so main and the cluster diverged silently and indefinitely.
      #
      # EXACTLY EIGHT top-level properties, and that is a hard limit, not a
      # style: GitHub rejects a `client_payload` with more than TEN and fails
      # the whole request. xema-base shipped a fifteen-property payload that
      # failed on every single build with "No more than 10 properties are
      # allowed" — no dispatch ever arrived, and nothing noticed because the
      # build itself stayed green. Adding a ninth field here is fine; a
      # eleventh silently breaks every deploy.
      #
      # `imageDigest` is the pinned `repo@sha256:…`, never a tag: the tag can be
      # repointed after the dispatch is sent, and the digest is what cosign
      # signed and what the deploy gate verifies its three attestations against.
      - name: Bind the immutable deployment digest
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        id: bind
        run: |
          set -euo pipefail
          if [[ ! "${IMAGE}" =~ ^ghcr\.io/xema-dev/[a-z0-9][a-z0-9._-]*$ ]]; then
            echo "::error::invalid image repository '${IMAGE}'"; exit 1
          fi
          if [[ ! "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::invalid immutable image digest '${DIGEST}'"; exit 1
          fi
          echo "image_digest=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Report the published coordinates
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          CONTENT_TAG: ${{ steps.img.outputs.content_tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          echo "::notice::${IMAGE}:${CONTENT_TAG} published (${DIGEST}) — the coordinate every distribution lock names."

      # Say WHICH secret is missing, rather than letting the dispatch action fail
      # on an empty token with a bare 401 that names nothing.
      #
      # This is NOT `continue-on-error`, and that is a settled position in this
      # fleet: identity-api carried exactly that allowance "so a
      # not-yet-provisioned dispatch token never reds the build", and it expired
      # the moment the token was provisioned — after which it only meant a failed
      # hand-off could never be seen, because the image builds, the run reports
      # success, and nothing is deployed.
      #
      # A red run here is the correct signal: a producer that cannot hand off IS
      # broken. Nothing is lost by failing — the image and both its tags are
      # already pushed by the time this runs, so the lock coordinate an appliance
      # install resolves lands either way.
      - name: Require the deploy dispatch credential
        env:
          DISPATCH_TOKEN: ${{ secrets.XEMA_DEPLOY_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DISPATCH_TOKEN:-}" ]; then
            echo "::error::XEMA_DEPLOY_DISPATCH_TOKEN is not configured on this repository."
            echo "::error::docs-api is a registered xema.deploy-service/v3 producer, so this build must hand its coordinate to ${DEPLOY_REPO}; without the token it cannot."
            echo "::error::Fix: add a PAT with repository-dispatch rights on ${DEPLOY_REPO} as the secret XEMA_DEPLOY_DISPATCH_TOKEN (gh secret set XEMA_DEPLOY_DISPATCH_TOKEN --repo ${GITHUB_REPOSITORY})."
            echo "::error::The image and its tags are already pushed; only the deploy hand-off is missing."
            exit 1
          fi

      - name: Dispatch deploy to xema-deploy
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3
        with:
          token: ${{ secrets.XEMA_DEPLOY_DISPATCH_TOKEN }}
          repository: ${{ env.DEPLOY_REPO }}
          event-type: deploy-service
          client-payload: |
            {
              "payloadVersion": "${{ env.DEPLOY_SERVICE_PAYLOAD_VERSION }}",
              "deployment": "${{ env.DEPLOY_TARGET }}",
              "service": "${{ env.SERVICE }}",
              "sourceRepository": "${{ github.repository }}",
              "sourceSha": "${{ github.sha }}",
              "deployServicesManifestSha256": "${{ steps.predicates.outputs.manifest_sha256 }}",
              "imageDigest": "${{ steps.bind.outputs.image_digest }}",
              "sourceRunUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }


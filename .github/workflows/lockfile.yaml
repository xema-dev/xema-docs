name: Lockfile

# ═══════════════════════════════════════════════════════════════════════════
# `npm ci` IS the lockfile gate — it just had no home in this repository.
#
#   `npm ci` refuses to run when package.json and package-lock.json disagree,
#   and it says exactly which dependency drifted. `npm install` does not: it
#   silently REPAIRS the lockfile in place, so a desync passes and reappears as
#   an unexplained diff in someone else's branch.
#
#   Until this workflow existed, this repository ran `npm install` on
#   push-to-main (deploy-pages.yaml) and nothing at all on a pull request, and
#   its Dockerfile has no npm step ("Zero npm dependencies — copy the server and
#   the content bundle as-is"). So a package.json/package-lock.json desync
#   could not fail anything here. It was caught instead by a scanner in the
#   xema-monorepo aggregator, which compared the two files by hand — a second
#   implementation of a check npm already performs, running in a repository
#   that cannot fix what it finds.
#
#   This is that enforcement, moved to where the fix lives, using the tool that
#   already knows how to do it.
#
# WHY ubuntu-24.04 AND NOT [self-hosted, linux]
#
#   xema-docs is a PUBLIC repository, and the org's self-hosted runner group
#   sets allows_public_repositories=false — a `[self-hosted, linux]` job here
#   queues forever and is never scheduled. Same reason deploy-pages.yaml uses a
#   hosted runner.
# ═══════════════════════════════════════════════════════════════════════════

on:
  push:
    # `develop` is the active integration branch of the three-rung model, and
    # until this line a push to it created NO RUN AT ALL in this repository.
    # This is the only VERIFICATION workflow here — build-image.yaml,
    # deploy-pages.yaml and release-arm64.yaml publish or deploy the docs site
    # and are deliberately left on main alone.
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A push to `main` is a VERDICT on that commit, so it keys per SHA and is
  # never cancelled: a per-ref group with `cancel-in-progress: true` kills
  # the merged commit's own run the moment the next commit lands, and the
  # commit then carries no verdict at all. Measured fleet-wide before this
  # posture existed: 40% and 36% `cancelled` rates on main pushes, against
  # 0% in the repositories that had adopted it. A PR still cancels, which is
  # what the ref test below expresses.
  #
  # develop shares one group per ref, like a PR branch: at most one run executes and
  # one waits, a skipped commit is covered by the next run's tree, and
  # `cancel-in-progress` stays false on develop so a verdict always arrives.
  group: lockfile-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          # 22, not 20: `astro` declares `engines.node: >=22.12.0`, as do
          # `@astrojs/compiler-rs` and `@astrojs/prism`. Node 20 is excluded
          # outright, so an install here would not be the install the build
          # performs — which is the one thing this job exists to prove. Keep
          # this in lockstep with deploy-pages.yaml.
          node-version-file: .node-version
      # No `--ignore-scripts`, no `--no-audit` shortcut: this must be the same
      # install the build performs, or it proves something the build does not.
      # NOT the runner's own npm. `packageManager` in package.json is the single
      # declaration of which npm this repository installs with, and the script
      # below proves the CLI it resolved reports exactly that version before it
      # installs anything — so a lockfile can never be authored under one npm
      # and validated under another. It installs nothing globally: `npx --yes`
      # writes only to the per-user npx cache.
      - name: Install from the committed lockfile
        run: node tooling/ci/npm-toolchain.mjs ci
      # The whole gate is `npm run check`; the pre-push hook runs the same script, so CI and the push check one list.
      - name: Check
        run: npm run check

  # The develop image lane (T62 C1): only a green push to develop publishes
  # dev/<svc>:<contentHash> and :<sha>. A local reusable workflow, so it runs
  # from the develop copy of the repository. `needs: lockfile` is the only
  # verification this repository has on develop (npm ci, the arm64 probe test,
  # the keyspace test, the concept-frontmatter check); it does not build.
  develop-images:
    name: Develop images
    needs: [lockfile]
    if: ${{ !cancelled() && needs.lockfile.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    permissions:
      packages: write
      contents: read
      id-token: write
    uses: ./.github/workflows/develop-images.yaml

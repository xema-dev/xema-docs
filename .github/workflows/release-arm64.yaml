# ───────────────────────────────────────────────────────────────────────────
# THE arm64 IMAGE PLANE FOR `docs-api`, IN ITS OWN PIPELINE.
#
# Every appliance edition targets arm64 hardware — `xema-appliance`'s
# `os/dgx/install-k3s.sh` and `ansible/site.yml` HARD-FAIL on a non-arm64 host
# — and `docs-api` is a subject in the appliance locks. An amd64-only image
# makes those editions undeliverable.
#
# Why a SEPARATE workflow rather than a job in `build-image.yaml`:
#
#   Emulated arm64 under QEMU roughly doubles a build. As a job it would sit on
#   the release run's own graph, so a release would stay in-progress until the
#   emulated build finished and an arm64 failure would colour the run that
#   published the canonical image. Triggered instead by `workflow_run` it is a
#   DIFFERENT run with a different conclusion: it cannot delay a release,
#   cannot fail one, and can be re-run on its own.
#
# Ordering (`types: [completed]` + `conclusion == 'success'`) is what makes this
# safe: `build-image` has already pushed `:<contentHash>` and `:${SHA}` before
# this workflow starts.
#
# What it produces (D3): `linux/arm64` at `:<contentHash>-arm64`, then ONE
# `docker buildx imagetools create` that publishes a multi-arch index on the
# canonical `:<contentHash>` coordinate — the ref every distribution lock names.
# amd64 is REFERENCED, never rebuilt.
#
# What it deliberately does NOT touch: `:${SHA}` and `:latest`. `:${SHA}` is the
# single-platform subject the amd64 build published, and is the input this merge
# reads — republishing it as an index would feed a previous merge back into
# itself. `:latest` is a moving pointer, and this run can start long after a
# newer commit has moved it — merging into it would drag it BACKWARD onto older
# content.
#
# Runners and credentials are forced exactly as in `build-image.yaml`: this is
# a PUBLIC repository (no self-hosted runner group) and the `docs-api` GHCR
# package is linked to another repository (no `github.token` write access).
# ───────────────────────────────────────────────────────────────────────────
name: Release arm64

on:
  workflow_run:
    workflows: ['Build docs-api image']
    types: [completed]
  # Manual backfill. An arm64 build that failed on a QEMU flake is not retried
  # by the next push, so the operator needs a way to ask for one without a
  # no-op commit.
  workflow_dispatch:

concurrency:
  # One lane per source commit, and QUEUE rather than cancel: a cancelled run
  # leaves the canonical coordinate amd64-only, and nothing would rebuild it
  # until the source changes again.
  group: release-arm64-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # Keyless cosign exchanges the job's OIDC token at Fulcio for a short-lived
  # signing certificate; without `id-token: write` the signing step fails.
  id-token: write

env:
  REGISTRY: ghcr.io
  REGISTRY_ORG: xema-dev
  SERVICE: docs-api

  # Must stay value-identical to `build-image.yaml`'s attestation contract: the
  # two lanes attach attestations to the two halves of ONE index, and a
  # predicate shape that differs between them is a difference no consumer can
  # see until verification fails. BuildKit — not cosign — decides the SLSA
  # predicate version, which is why the image is pinned rather than floating.
  BUILDKIT_IMAGE: moby/buildkit:v0.31.2
  SLSA_PROVENANCE_VERSION: v1
  # `slsaprovenance1` is cosign's v1.0 alias. Plain `slsaprovenance` maps to
  # SLSA v0.2, which would unmarshal a v1 predicate into the v0.2 struct and
  # drop every field — an attestation that claims v0.2 and contains nothing.
  COSIGN_SLSA_PREDICATE_FLAG: slsaprovenance1
  COSIGN_SBOM_PREDICATE_FLAG: spdxjson
  ATTESTATION_OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  arm64:
    name: arm64 supplement
    # NOT an opt-in `BUILD_SUPPLEMENTARY_ARCHES` variable. That gate defaulted
    # OFF, which — now that an appliance edition cannot be delivered without
    # arm64 — meant the default was "permanently undeliverable". The kill
    # switch is inverted instead: an operator sets
    # `SKIP_SUPPLEMENTARY_ARCHES=true` to stand the lane down. That can never
    # ship a bad release silently: delivery verifies `requiredPlatforms`
    # against the real registry manifest and fails CLOSED, so a stood-down lane
    # surfaces as a distribution that is loudly not deliverable yet.
    #
    # `github.ref` in a `workflow_run` job is always the DEFAULT branch, never
    # the branch that was built — so the branch assertion MUST read
    # `workflow_run.head_branch`.
    if: >-
      vars.SKIP_SUPPLEMENTARY_ARCHES != 'true' &&
      (
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main') ||
        (github.event_name == 'workflow_dispatch' &&
         github.ref == 'refs/heads/main')
      )
    # GitHub-hosted, NOT self-hosted: this is a PUBLIC repo and the org's
    # Default runner group has allows_public_repositories=false, so a
    # [self-hosted, linux] label queues with no eligible runner until GitHub
    # expires it. The file header states the same constraint — keep both true.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # A job-level `permissions:` block REPLACES the workflow-level one rather
    # than merging with it, so `id-token: write` MUST be repeated here.
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # The COMMIT that was built, never the branch tip. `main` may have moved
      # while the amd64 build ran; hashing or building the tip would produce an
      # arm64 image for source the amd64 half never saw.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Compute image coordinates
        id: img
        env:
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          IMAGE="$(printf '%s' "${REGISTRY}/${REGISTRY_ORG}/${SERVICE}" \
            | tr '[:upper:]' '[:lower:]')"
          # The SAME script, at the SAME commit, as the amd64 build — so this
          # resolves to the SAME coordinate by construction, never by
          # coincidence. Whole-repo image, so the hashed path is the repository
          # root. Reads the commit's git objects, never the work tree.
          CONTENT_TAG="$(
            node tooling/release/compute-image-tag.mjs \
              --service "${SERVICE}" --path . --commit "${COMMIT}"
          )"
          case "${CONTENT_TAG}" in
            *[!0-9a-f]* | "")
              echo "::error::compute-image-tag.mjs emitted a non-hex tag for ${SERVICE}"
              exit 1
              ;;
          esac
          if [ "${#CONTENT_TAG}" -ne 64 ]; then
            echo "::error::compute-image-tag.mjs emitted a ${#CONTENT_TAG}-char tag for ${SERVICE}; expected 64 (sha256 hex)"
            exit 1
          fi
          {
            echo "image=${IMAGE}"
            echo "content_tag=${CONTENT_TAG}"
            echo "amd64_source=${IMAGE}:${COMMIT}"
          } >> "$GITHUB_OUTPUT"

      # IS THE SUPPLEMENT STILL OWED? This lane rebuilt and re-merged
      # UNCONDITIONALLY, and the `imagetools create -t :<contentHash>` below
      # republishes the canonical coordinate BY DESIGN — so a run that
      # supplements an already-complete index does no useful work and MOVES A
      # TAG somebody may already have sealed. `docs-api` is a subject in the
      # appliance locks (see the file header), so a moved digest here is a
      # refused re-seal, not an untidiness.
      #
      # Measured in xema-cultivars, on `app-forge-api:723843b157…`: arm64 run
      # 35538586977 published index sha256:432daa9a… on 2026-09-20;
      # xema-distributions SEALED that digest into five editions on 2026-09-21
      # 10:17; a RE-RUN of a sibling run armed off the SAME build run, at the
      # SAME commit, whose attempt 1 had one service CANCELLED, rebuilt arm64 at
      # 14:01 and re-merged to sha256:6321fd70…. From 18:10 `seal-image-digests`
      # refused — correctly — and five of nine editions could not be re-sealed.
      #
      # THIS LANE IS NOT A COPY of that one. The arm64 lanes in this fleet are
      # owned per repository and differ by hundreds of lines; what they share is
      # the unconditional merge, so each is ported separately. The PROBE, by
      # contrast, is vendored BYTE-IDENTICAL from the copy `xema-deploy` and
      # `xema-host-web` carry — the self-contained variant, because this
      # repository has no `compute-service-build-matrix.mjs` to import the
      # credential helper from. Keeping the three files byte-identical is what
      # makes their drift detectable by `diff` alone; do not edit this copy in
      # isolation.
      #
      # The rebuild cannot help but move the digest: no `SOURCE_DATE_EPOCH` is
      # set anywhere in this repository, so the image config's `created` and
      # `history[].created` are wall-clock and the manifest digest changes even
      # when every layer byte is identical. amd64 does not move only because it
      # is never rebuilt here — the merge REFERENCES `:${COMMIT}`.
      #
      # It is a PROOF, not a read: the arm64 child is resolved by digest and its
      # architecture taken from the image CONFIG. A descriptor-only check would
      # skip a mislabelled index forever, and this lane is the only thing that
      # can repair one. Anything other than 200/404 THROWS — a 403 on a package
      # this repo cannot read is indistinguishable from an image that was never
      # pushed, and a guess either moves a sealed tag or strands a coordinate
      # amd64-only. A red arm64 run costs nothing on the prod path: this lane is
      # `workflow_run`, off the release graph.
      #
      # Credentials are the SAME pair the registry login below uses, for the
      # same reason: the `docs-api` GHCR package is linked to another
      # repository, so `github.token` cannot read it either.
      - name: Is an arm64 supplement still owed for this coordinate?
        id: supplement
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          CONTENT_TAG: ${{ steps.img.outputs.content_tag }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: node tooling/release/arm64-supplement-needed.mjs

      # QEMU is needed for EMULATED arm64 on an amd64 runner. Remove once this
      # job runs on native arm64 runners.
      - name: Set up QEMU (emulated arm64)
        if: steps.supplement.outputs.needed == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Same pin as the amd64 lane, for the same reason: BuildKit decides
          # the emitted SLSA provenance version.
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # NOT `github.token` — the `docs-api` GHCR package is linked to a
          # different repository, so this repo's run-scoped token cannot push.
          password: ${{ secrets.GH_PACKAGES_TOKEN }}

      # ORDER MATTERS. The per-arch tag is published FIRST and the canonical
      # coordinate is touched LAST, so a build that fails here leaves
      # `:<contentHash>` exactly as the amd64 build left it — a working
      # single-arch image, never a half-merged index.
      - name: Build & push arm64 image (per-arch tag)
        id: arm_build
        if: steps.supplement.outputs.needed == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ steps.img.outputs.image }}:${{ steps.img.outputs.content_tag }}-arm64
          build-args: |
            BUILD_SHA=${{ github.event.workflow_run.head_sha || github.sha }}
          # Arch-independent layers (metadata, config) are reused where
          # BuildKit can; the compiled layers cannot be, by definition.
          cache-from: type=registry,ref=${{ steps.img.outputs.amd64_source }}
          # Symmetric with the amd64 build, which now attaches provenance and an
          # SBOM so `docs-api` can satisfy the `xema.deploy-service/v3` contract.
          #
          # The symmetry is the point, and it is why this changed in the same
          # commit. This lane used to attach nothing BECAUSE the amd64 lane
          # attached nothing; the moment that stopped being true, leaving this
          # at `false` would have produced exactly the half-attested index the
          # previous comment here warned about — evidence that reads as covering
          # the whole index while covering one platform — merely with the two
          # halves swapped.
          provenance: mode=max,version=${{ env.SLSA_PROVENANCE_VERSION }}
          sbom: true

      - name: Install pinned cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.3

      # Gated on the SAME probe as the build above, and that pairing is the
      # invariant: this is the only step that republishes `:<contentHash>`, so
      # it must never run without a freshly built arm64 image to merge.
      #
      # Everything BELOW stays ungated on purpose. On the skip path the index
      # already carries both platforms, so resolving its digest, signing it and
      # attesting it all still run — which is also what repairs a coordinate
      # whose earlier run merged and then died before signing. None of those
      # steps republishes the tag: a cosign signature is a separate object, so
      # the digest they act on is the one the merge left.
      - name: Merge arm64 into the content-addressed multi-arch index
        if: steps.supplement.outputs.needed == 'true'
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          CONTENT_TAG: ${{ steps.img.outputs.content_tag }}
          AMD64_SOURCE: ${{ steps.img.outputs.amd64_source }}
          ARM64_DIGEST: ${{ steps.arm_build.outputs.digest }}
        run: |
          set -euo pipefail
          ARM64_SOURCE="${IMAGE}:${CONTENT_TAG}-arm64"

          if [[ ! "${ARM64_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::arm64 build produced an invalid digest '${ARM64_DIGEST}'"
            exit 1
          fi

          # BOTH sources must already resolve in the registry before the
          # canonical coordinate is touched at all. `imagetools create` is a
          # single manifest PUT, so with both inputs verified present the tag
          # either keeps its current value or lands on a complete index — there
          # is no intermediate state in which it points at something broken.
          docker buildx imagetools inspect "${AMD64_SOURCE}" >/dev/null
          docker buildx imagetools inspect "${ARM64_SOURCE}" >/dev/null

          # The amd64 SIDE is sourced from `:${COMMIT}`, NOT from
          # `:<contentHash>`. `:${COMMIT}` is never merged into, so it is always
          # the single-platform subject the build produced — which makes this
          # merge idempotent: re-running it rebuilds the identical index from
          # the identical two inputs. Sourcing from the canonical tag would
          # instead feed a previous merge's index back into itself.
          docker buildx imagetools create \
            -t "${IMAGE}:${CONTENT_TAG}" "${AMD64_SOURCE}" "${ARM64_SOURCE}"

          # The published index must actually carry BOTH platforms. `unknown`
          # entries are BuildKit's attestation manifests, not runnable images.
          docker buildx imagetools inspect --raw "${IMAGE}:${CONTENT_TAG}" \
            > "${RUNNER_TEMP}/index.json"
          jq -e '
            [ .manifests[]
              | select(.platform.os != "unknown")
              | "\(.platform.os)/\(.platform.architecture)" ] as $p
            | ($p | index("linux/amd64")) and ($p | index("linux/arm64"))
          ' "${RUNNER_TEMP}/index.json" >/dev/null \
            || { echo "::error::${IMAGE}:${CONTENT_TAG} is not a linux/amd64 + linux/arm64 index"; exit 1; }

          echo "::notice::${IMAGE}:${CONTENT_TAG} is now a multi-arch index (linux/amd64 + linux/arm64)."

      # The merge above republished the canonical coordinate as an INDEX with a
      # NEW digest. cosign signs BY DIGEST and only the amd64 child was ever
      # signed (by the build workflow, on `:${SHA}`), so without this step the
      # digest an admission policy actually resolves and verifies carries no
      # signature at all — arm64 landing would silently un-sign the coordinate.
      #
      # Signing the INDEX rather than the per-platform children is deliberate:
      # the index digest is what every consumer resolves and what
      # policy-controller admits, and an OCI index names its children BY
      # DIGEST — so one signature over the index content-addressably covers the
      # exact amd64 and arm64 manifests it lists. Verifying per-platform
      # children instead would leave the admitted digest itself unsigned.
      - name: Keyless-sign the multi-arch index
        id: sign_index
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          CONTENT_TAG: ${{ steps.img.outputs.content_tag }}
          CERTIFICATE_IDENTITY: https://github.com/xema-dev/xema-docs/.github/workflows/release-arm64.yaml@refs/heads/main
          OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          # Ask the registry for the digest the canonical tag now resolves to,
          # rather than deriving it locally: that is precisely the value a
          # puller resolves, so a mismatch cannot hide here.
          INDEX_DIGEST="$(
            docker buildx imagetools inspect \
              --format '{{.Manifest.Digest}}' "${IMAGE}:${CONTENT_TAG}"
          )"
          if [[ ! "${INDEX_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::could not resolve a digest for ${IMAGE}:${CONTENT_TAG} (got '${INDEX_DIGEST}')"
            exit 1
          fi
          cosign sign --yes "${IMAGE}@${INDEX_DIGEST}"
          # Re-assert the signature HERE, in the producing run: a signature that
          # does not verify against the exact identity a policy pins is worth
          # nothing, and discovering that at admission time is far too late.
          cosign verify \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            --certificate-github-workflow-repository "${GITHUB_REPOSITORY}" \
            --certificate-github-workflow-ref "${GITHUB_REF}" \
            --certificate-github-workflow-sha "${GITHUB_SHA}" \
            "${IMAGE}@${INDEX_DIGEST}" >/dev/null
          {
            echo "index_digest=${INDEX_DIGEST}"
            echo "subject=${IMAGE}@${INDEX_DIGEST}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::${IMAGE}:${CONTENT_TAG} index ${INDEX_DIGEST} is keyless-signed."

      # ─────────────────────────────────────────────────────────────────────
      # ATTEST THE MERGED INDEX.
      #
      # The amd64 lane attested its pre-merge manifest; the arm64 build
      # attached its own predicates to the per-arch tag. But the digest the
      # lock coordinate resolves AFTER this merge is the INDEX digest, and
      # the detached distribution-plane evidence (produced for this image by
      # xema-deploy's produce-docs-image-evidence.yaml — a public repo cannot
      # run the private evidence tooling itself) refuses a subject whose
      # delivered digest carries no cosign SBOM + SLSA provenance
      # attestations. So this merge step re-runs the attest calls on the
      # merged index, exactly as the single-platform producers attest their
      # delivered digest.
      #
      # The predicates re-attested are the linux/amd64 platform's, exported
      # from the merged index itself: the amd64 build is the PRIMARY build
      # of this image, and both per-arch predicates record the SAME source
      # commit — the SLSA predicate's VCS revision is asserted equal to the
      # built commit below, so the exported predicate describes exactly the
      # build this index came from.
      # ─────────────────────────────────────────────────────────────────────
      - name: Export the amd64 SLSA provenance and SBOM predicates from the merged index
        id: index_predicates
        env:
          SUBJECT: ${{ steps.sign_index.outputs.subject }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          PROVENANCE_RAW="${RUNNER_TEMP}/docs-api-index.provenance-raw.json"
          PROVENANCE="${RUNNER_TEMP}/docs-api-index.slsa-provenance.json"
          SBOM_RAW="${RUNNER_TEMP}/docs-api-index.sbom-raw.json"
          SBOM="${RUNNER_TEMP}/docs-api-index.spdx.json"
          docker buildx imagetools inspect "${SUBJECT}" \
            --format '{{json .Provenance}}' > "${PROVENANCE_RAW}"
          # A multi-platform subject renders `{"<platform>": {"SLSA": …}}` per
          # platform; assert the exact two-platform shape this merge
          # publishes, then take the amd64 platform's predicate (see the step
          # comment). Any other shape fails here instead of attesting one
          # platform's provenance as if it covered the whole index.
          jq -e '(keys | sort) == ["linux/amd64", "linux/arm64"]' \
            "${PROVENANCE_RAW}" >/dev/null
          jq -e --arg sha "${SOURCE_SHA}" \
              '."linux/amd64".SLSA
               | select(.buildDefinition.buildType | type == "string")
               | select(.runDetails.metadata.buildkit_metadata.vcs.revision
                        == $sha)' \
            "${PROVENANCE_RAW}" > "${PROVENANCE}"
          docker buildx imagetools inspect "${SUBJECT}" \
            --format '{{json .SBOM}}' > "${SBOM_RAW}"
          jq -e '(keys | sort) == ["linux/amd64", "linux/arm64"]' \
            "${SBOM_RAW}" >/dev/null
          jq -e '."linux/amd64".SPDX
                 | select(.spdxVersion | startswith("SPDX-"))
                 | select(.packages | type == "array")' \
            "${SBOM_RAW}" > "${SBOM}"
          test -s "${PROVENANCE}"
          test -s "${SBOM}"
          {
            echo "provenance=${PROVENANCE}"
            echo "sbom=${SBOM}"
          } >> "$GITHUB_OUTPUT"

      - name: Keyless-attest the merged multi-arch index
        env:
          SUBJECT: ${{ steps.sign_index.outputs.subject }}
          PROVENANCE: ${{ steps.index_predicates.outputs.provenance }}
          SBOM: ${{ steps.index_predicates.outputs.sbom }}
          CERTIFICATE_IDENTITY: https://github.com/xema-dev/xema-docs/.github/workflows/release-arm64.yaml@refs/heads/main
          OIDC_ISSUER: ${{ env.ATTESTATION_OIDC_ISSUER }}
        run: |
          set -euo pipefail
          cosign attest --yes \
            --type "${COSIGN_SLSA_PREDICATE_FLAG}" \
            --predicate "${PROVENANCE}" \
            "${SUBJECT}"
          cosign attest --yes \
            --type "${COSIGN_SBOM_PREDICATE_FLAG}" \
            --predicate "${SBOM}" \
            "${SUBJECT}"
          # Re-assert HERE, in the producing run, exactly what the evidence
          # assembler and every later verifier will demand.
          for PREDICATE_TYPE in \
            "${COSIGN_SLSA_PREDICATE_FLAG}" \
            "${COSIGN_SBOM_PREDICATE_FLAG}"; do
            cosign verify-attestation \
              --certificate-identity "${CERTIFICATE_IDENTITY}" \
              --certificate-oidc-issuer "${OIDC_ISSUER}" \
              --certificate-github-workflow-repository "${GITHUB_REPOSITORY}" \
              --certificate-github-workflow-ref "${GITHUB_REF}" \
              --certificate-github-workflow-sha "${GITHUB_SHA}" \
              --type "${PREDICATE_TYPE}" "${SUBJECT}" >/dev/null
          done
          echo "::notice::${SUBJECT} is keyless-attested (SLSA provenance + SBOM)."

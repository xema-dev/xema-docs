name: Deploy docs to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-deploy:
    # GitHub-hosted: xema-docs is a PUBLIC repo, and the org self-hosted runner
    # group has allows_public_repositories=false, so [self-hosted, linux] jobs
    # here queue forever (never scheduled). The Astro build has no private deps,
    # so a hosted runner is both correct and the recommended choice for public repos.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4

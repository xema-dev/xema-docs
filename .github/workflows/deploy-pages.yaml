# Self-hosted runners (xema-dev). Registration:
#   https://github.com/organizations/xema-dev/settings/actions/runners
# Runner labels: [self-hosted, linux, xema-dev]. macOS/Windows kept on
# GitHub-hosted runners only where the build genuinely requires that OS.
name: Deploy docs to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: [self-hosted, linux, xema-dev]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4

name: Deploy docs to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-deploy:
    # GitHub-hosted: xema-docs is a PUBLIC repo, and the org self-hosted runner
    # group has allows_public_repositories=false, so [self-hosted, linux] jobs
    # here queue forever (never scheduled). The Astro build has no private deps,
    # so a hosted runner is both correct and the recommended choice for public repos.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # `npm ci`, not `npm install`. `install` silently REWRITES the lockfile
      # when it disagrees with package.json, so the published site would be
      # built from a dependency tree nobody committed — and the desync would
      # never surface here. `ci` fails instead, naming the drift.
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4

# Develop image lane (T62 C1): thin, exactly pinned calls of @xemahq/release-policy xema-develop-images (T34).
# The CLI owns the gate (push or workflow_dispatch on refs/heads/develop), the plan, reuse/adopt/build, tags and summary.
#
# Called from `lockfile.yaml` after its verification job is green. It is a LOCAL
# reusable workflow (`uses: ./.github/workflows/...`) so it runs from the develop
# copy. Subjects are the services of tooling/release/deploy-services-manifest.json,
# the file build-image.yaml asserts its build universe against.
#
# Hosted runner and GITHUB_TOKEN: this repository is PUBLIC (see lockfile.yaml),
# so a self-hosted job would queue forever.
name: Develop images

on:
  workflow_call:

permissions:
  contents: read

env:
  # Exact @xemahq/release-policy version; raised by hand after each publish.
  RELEASE_POLICY_VERSION: 14.2.0
  REGISTRY: ghcr.io
  REGISTRY_ORG: ${{ github.repository_owner }}

jobs:
  plan:
    name: List develop image subjects
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      open: ${{ steps.plan.outputs.open }}
      subjects: ${{ steps.plan.outputs.subjects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Plan (and gate) the develop images
        id: plan
        run: >-
          npx --yes --package="@xemahq/release-policy@${RELEASE_POLICY_VERSION}" --
          xema-develop-images subjects
          --subjects-command 'cat tooling/release/deploy-services-manifest.json'

  image:
    name: Develop image (${{ matrix.entry.service }})
    needs: plan
    # The CLI decided the gate; this only forwards it (an empty matrix is a workflow error).
    if: needs.plan.outputs.open == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # ONE lane per subject, across commits; a running build is never cancelled.
    concurrency:
      group: develop-image-${{ github.repository }}-${{ matrix.entry.service }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.plan.outputs.subjects) }}
    steps:
      # Full history, exactly as build-image.yaml: compute-image-tag.mjs reads git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.31.2

      - name: Develop image
        env:
          SUBJECT: ${{ toJson(matrix.entry) }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          npx --yes --package="@xemahq/release-policy@${RELEASE_POLICY_VERSION}" --
          xema-develop-images image
          --subject "${SUBJECT}"
          --coordinate-command 'node tooling/release/compute-image-tag.mjs --service "$SERVICE" --path "$SERVICE_PATH" --commit "$SHA"'

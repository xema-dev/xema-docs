# Develop image lane (T62 C1): thin, exactly pinned calls of @xemahq/release-policy xema-develop-images (T34).
# The CLI owns the gate (push or workflow_dispatch on refs/heads/develop), the plan, reuse/adopt/build, tags and summary.
#
# Called from `lockfile.yaml` after its verification job is green. It is a LOCAL
# reusable workflow (`uses: ./.github/workflows/...`) so it runs from the develop
# copy. Subjects are the services of tooling/release/deploy-services-manifest.json,
# the file build-image.yaml asserts its build universe against.
#
# Hosted runner and GITHUB_TOKEN: this repository is PUBLIC (see lockfile.yaml),
# so a self-hosted job would queue forever.
name: Develop images

on:
  workflow_call:

permissions:
  contents: read

env:
  # Exact @xemahq/release-policy version; raised by hand after each publish.
  RELEASE_POLICY_VERSION: 14.3.0
  REGISTRY: ghcr.io
  REGISTRY_ORG: ${{ github.repository_owner }}

jobs:
  plan:
    name: List develop image subjects
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      open: ${{ steps.plan.outputs.open }}
      subjects: ${{ steps.plan.outputs.subjects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Plan (and gate) the develop images
        id: plan
        run: >-
          npx --yes --package="@xemahq/release-policy@${RELEASE_POLICY_VERSION}" --
          xema-develop-images subjects
          --subjects-command 'cat tooling/release/deploy-services-manifest.json'

  image:
    name: Develop image (${{ matrix.entry.service }})
    needs: plan
    # The CLI decided the gate; this only forwards it (an empty matrix is a workflow error).
    if: needs.plan.outputs.open == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # ONE lane per subject, across commits; a running build is never cancelled.
    concurrency:
      group: develop-image-${{ github.repository }}-${{ matrix.entry.service }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      # keyless cosign sign / attest under the develop identity below.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.plan.outputs.subjects) }}
    steps:
      # Full history, exactly as build-image.yaml: compute-image-tag.mjs reads git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.31.2

      - name: Develop image
        id: image
        env:
          SUBJECT: ${{ toJson(matrix.entry) }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          npx --yes --package="@xemahq/release-policy@${RELEASE_POLICY_VERSION}" --
          xema-develop-images image
          --subject "${SUBJECT}"
          --coordinate-command 'node tooling/release/compute-image-tag.mjs --service "$SERVICE" --path "$SERVICE_PATH" --commit "$SHA"'
          --attestations

      # Sign and attest under this workflow's own identity
      # (`develop-images.yaml@refs/heads/develop`); main's `xema-promote-image` accepts a
      # develop digest only on that signature and its SLSA v1 provenance. A reused or adopted
      # image built without attestations is left unattested on purpose: main misses on it.
      - name: Install pinned cosign
        if: steps.image.outputs.attestations != 'absent-on-reused'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.3

      - name: Sign the develop image and attest its provenance and SBOM
        if: steps.image.outputs.attestations != 'absent-on-reused'
        env:
          DEV_REF: ${{ steps.image.outputs.ref }}
          DIGEST: ${{ steps.image.outputs.digest }}
          CONTENT_TAG: ${{ steps.image.outputs.content_tag }}
          SERVICE: ${{ matrix.entry.service }}
          SERVICE_PATH: ${{ matrix.entry.path }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::invalid develop image digest '${DIGEST}'"
            exit 1
          fi
          SUBJECT="${DEV_REF}@${DIGEST}"
          PROVENANCE_RAW="${RUNNER_TEMP}/${SERVICE}.provenance-raw.json"
          PROVENANCE="${RUNNER_TEMP}/${SERVICE}.slsa-provenance.json"
          SBOM="${RUNNER_TEMP}/${SERVICE}.spdx.json"
          docker buildx imagetools inspect "${SUBJECT}" --format '{{json .Provenance}}' > "${PROVENANCE_RAW}"
          npx --yes --package="@xemahq/release-policy@${RELEASE_POLICY_VERSION}" -- \
            xema-select-index-provenance \
              --provenance "${PROVENANCE_RAW}" --source-sha "${SOURCE_SHA}" \
              --content-tag "${CONTENT_TAG}" \
              --single-platform --out "${PROVENANCE}" \
              --service "${SERVICE}" --service-path "${SERVICE_PATH}"
          docker buildx imagetools inspect "${SUBJECT}" --format '{{json .SBOM}}' \
            | jq -e '.SPDX | select(.spdxVersion | startswith("SPDX-")) | select(.packages | type == "array")' \
            > "${SBOM}"
          test -s "${PROVENANCE}"
          test -s "${SBOM}"
          cosign sign --yes "${SUBJECT}"
          cosign attest --yes --type slsaprovenance1 --predicate "${PROVENANCE}" "${SUBJECT}"
          cosign attest --yes --type spdxjson --predicate "${SBOM}" "${SUBJECT}"
          cosign verify \
            --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/develop-images.yaml@refs/heads/develop" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${SUBJECT}" >/dev/null

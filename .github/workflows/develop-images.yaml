# The develop image lane (T62 contract C1).
#
# Called from `lockfile.yaml` ONLY on a `push` to `develop` and only after its
# verification job is green at that SHA. It is a LOCAL reusable workflow
# (`uses: ./.github/workflows/...`) so it runs from the develop copy; a
# `workflow_run` trigger would execute the default branch's copy and stay inert
# until promoted.
#
# For every subject of this repository (every service in
# tooling/release/deploy-services-manifest.json, the file build-image.yaml
# asserts its build universe against) it pushes
#   ghcr.io/<owner>/dev/<name>:<contentHash>   the key the RELEASE lane computes
#   ghcr.io/<owner>/dev/<name>:<github.sha>    the producing develop commit
# into the DEV namespace, never a release coordinate. `:<contentHash>` is built
# once and never re-pointed: when it exists the SHA tag is added to the existing
# digest instead of rebuilding.
#
# NOT here, by contract: no signing, no attestation (provenance/SBOM are off),
# no deploy dispatch, no edition or lock writes. build-image.yaml (main) and
# release-arm64.yaml are unchanged.
#
# Hosted runner and GITHUB_TOKEN: this repository is PUBLIC (see lockfile.yaml),
# so a self-hosted job would queue forever.
name: Develop images

on:
  workflow_call:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  REGISTRY_ORG: ${{ github.repository_owner }}
  # The platforms a develop image carries. presenca's requiredPlatforms is
  # linux/amd64 and nothing else here assumes it: a develop edition that requires
  # arm64 must widen this value (and the build will then run under QEMU).
  DEVELOP_IMAGE_PLATFORMS: linux/amd64
  BUILDKIT_IMAGE: moby/buildkit:v0.31.2

jobs:
  plan:
    name: List develop image subjects
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      subjects: ${{ steps.list.outputs.subjects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: List subjects
        id: list
        run: |
          set -euo pipefail
          subjects="$(jq -c '.services | map({service, path, imageRepository})' \
            tooling/release/deploy-services-manifest.json)"
          echo "${subjects}" | jq -e 'length > 0' >/dev/null
          echo "subjects=${subjects}" >> "${GITHUB_OUTPUT}"

  image:
    name: Develop image (${{ matrix.entry.service }})
    needs: plan
    runs-on: ubuntu-24.04
    # ONE lane per subject, across commits; a running build is never cancelled so
    # no coordinate is half-published and its contentHash is there for the next
    # commit's probe to REUSE instead of rebuilding.
    concurrency:
      group: develop-image-${{ github.repository }}-${{ matrix.entry.service }}
      cancel-in-progress: false
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.plan.outputs.subjects) }}
    steps:
      # Full history, exactly as build-image.yaml: compute-image-tag.mjs reads git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # The contentHash is computed by the release lane's own tool
      # (`compute-image-tag.mjs`, exactly as build-image.yaml invokes it).
      - name: Compute the release lane's contentHash
        id: img
        env:
          SERVICE: ${{ matrix.entry.service }}
          SERVICE_PATH: ${{ matrix.entry.path }}
          MANIFEST_IMAGE: ${{ matrix.entry.imageRepository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          EXPECTED="${REGISTRY}/${REGISTRY_ORG,,}/${SERVICE}"
          if [ "${MANIFEST_IMAGE}" != "${EXPECTED}" ]; then
            echo "::error::Manifest image '${MANIFEST_IMAGE}' differs from '${EXPECTED}'"
            exit 1
          fi
          CONTENT_TAG="$(
            node tooling/release/compute-image-tag.mjs \
              --service "${SERVICE}" --path "${SERVICE_PATH}" --commit "${SHA}"
          )"
          if ! [[ "${CONTENT_TAG}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::compute-image-tag.mjs emitted '${CONTENT_TAG}' for ${SERVICE}; expected 64 hex"
            exit 1
          fi
          echo "content_tag=${CONTENT_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Probe the develop coordinates
        id: probe
        env:
          SERVICE: ${{ matrix.entry.service }}
          MANIFEST_IMAGE: ${{ matrix.entry.imageRepository }}
          CONTENT_TAG: ${{ steps.img.outputs.content_tag }}
          SHA: ${{ github.sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tooling/release/develop-images.mjs probe

      # ADOPTED: the commit tag exists but the contentHash tag does not (a previous
      # run published the first and died before the second). Rebuilding would
      # only wedge on the pushed commit tag, so ADD the contentHash tag to the
      # existing digest, but only when that image is provably the build of this
      # SHA (its revision label equals the SHA). A mismatch refuses.
      - name: Add the contentHash tag to the existing commit image
        id: adopt
        if: steps.probe.outputs.content_exists != 'true' && steps.probe.outputs.commit_exists == 'true'
        env:
          DEV_IMAGE: ${{ steps.probe.outputs.dev_image }}
          CONTENT_TAG: ${{ steps.img.outputs.content_tag }}
          SHA: ${{ github.sha }}
        # Resolves the commit tag to a digest once, verifies and tags THAT digest.
        run: node tooling/release/develop-images.mjs adopt

      # REUSED: the contentHash already exists. Add the commit tag to the
      # existing digest (never a rebuild), unless it is already there.
      - name: Tag the existing digest with the commit
        id: reuse
        if: steps.probe.outputs.content_exists == 'true'
        env:
          DEV_IMAGE: ${{ steps.probe.outputs.dev_image }}
          CONTENT_TAG: ${{ steps.img.outputs.content_tag }}
          COMMIT_EXISTS: ${{ steps.probe.outputs.commit_exists }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "${DEV_IMAGE}:${CONTENT_TAG}" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::invalid digest '${digest}'"; exit 1; }
          if [ "${COMMIT_EXISTS}" != 'true' ]; then
            docker buildx imagetools create -t "${DEV_IMAGE}:${GITHUB_SHA}" "${DEV_IMAGE}@${digest}"
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      # BUILT: the contentHash is missing.
      - name: Set up Docker Buildx
        if: steps.probe.outputs.content_exists != 'true' && steps.probe.outputs.commit_exists != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      # Only `:<sha>` is pushed by the build; `:<contentHash>` is added by
      # reference below, after a fresh probe, so two commits with identical
      # inputs cannot both write the key.
      - name: Build and push the commit tag
        id: build
        if: steps.probe.outputs.content_exists != 'true' && steps.probe.outputs.commit_exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: ${{ env.DEVELOP_IMAGE_PLATFORMS }}
          tags: ${{ steps.probe.outputs.dev_image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
          provenance: false
          sbom: false

      - name: Add the contentHash tag unless it appeared meanwhile
        id: content
        if: steps.probe.outputs.content_exists != 'true' && steps.probe.outputs.commit_exists != 'true'
        env:
          SERVICE: ${{ matrix.entry.service }}
          MANIFEST_IMAGE: ${{ matrix.entry.imageRepository }}
          CONTENT_TAG: ${{ steps.img.outputs.content_tag }}
          SHA: ${{ github.sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEV_IMAGE: ${{ steps.probe.outputs.dev_image }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "${BUILT_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::invalid digest '${BUILT_DIGEST}'"; exit 1; }
          node tooling/release/develop-images.mjs probe > "${RUNNER_TEMP}/reprobe.txt"
          if grep -qx 'content_exists=true' "${RUNNER_TEMP}/reprobe.txt"; then
            digest="$(docker buildx imagetools inspect "${DEV_IMAGE}:${CONTENT_TAG}" --format '{{json .Manifest}}' | jq -r .digest)"
            echo "contentHash tag appeared concurrently at ${digest}; leaving it untouched"
          else
            docker buildx imagetools create -t "${DEV_IMAGE}:${CONTENT_TAG}" "${DEV_IMAGE}@${BUILT_DIGEST}"
            digest="${BUILT_DIGEST}"
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Job summary
        if: always() && steps.probe.outcome == 'success'
        env:
          SERVICE: ${{ matrix.entry.service }}
          DEV_IMAGE: ${{ steps.probe.outputs.dev_image }}
          CONTENT_TAG: ${{ steps.img.outputs.content_tag }}
          DIGEST: ${{ steps.reuse.outputs.digest || steps.adopt.outputs.digest || steps.content.outputs.digest }}
          REUSED: ${{ steps.probe.outputs.content_exists }}
          COMMIT_EXISTS: ${{ steps.probe.outputs.commit_exists }}
        run: |
          if [ "${REUSED}" = 'true' ]; then RESULT=reused
          elif [ "${COMMIT_EXISTS}" = 'true' ]; then RESULT=adopted
          else RESULT=built; fi
          {
            echo "| subject | dev ref | contentHash | digest | result |"
            echo "| --- | --- | --- | --- | --- |"
            echo "| ${SERVICE} | \`${DEV_IMAGE}\` | \`${CONTENT_TAG}\` | \`${DIGEST:-none}\` | ${RESULT} |"
          } >> "${GITHUB_STEP_SUMMARY}"

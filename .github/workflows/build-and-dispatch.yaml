# Self-hosted runners (xema-dev). Registration:
#   https://github.com/organizations/xema-dev/settings/actions/runners
# Runner labels: [self-hosted, linux].
name: Build & Dispatch (docs-api)

# Builds the docs-api image (this repo is the single source of truth for Xema
# public docs — content/ + the zero-dep Node server), pushes it to
# ghcr.io/xema-dev/docs-api:<sha>, and fires a `deploy-service`
# repository_dispatch to xema-dev/xema-deploy which holds the kubeconfig and
# runs the Helm upgrade (charts/docs-api).
#
# This is separate from `deploy-pages.yaml`, which publishes the (stub) Astro
# landing page to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-and-dispatch-docs-api-${{ github.ref }}
  cancel-in-progress: true  # SHA-tagged images; the matrix re-enumerates all services each run, so newest commit supersedes — cancel stale in-flight builds

env:
  REGISTRY: ghcr.io
  REGISTRY_ORG: xema-dev
  SERVICE: docs-api
  DEPLOY_REPO: xema-dev/xema-deploy

jobs:
  build:
    name: Build & dispatch docs-api
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute image coordinates
        id: img
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${REGISTRY_ORG}/${SERVICE}"
          IMAGE_LC="$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMAGE_LC}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.image }}
          tags: |
            type=raw,value=${{ steps.img.outputs.tag }}
            type=raw,value=latest

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=docs-api
          cache-to: type=gha,scope=docs-api,mode=max
          provenance: false

      - name: Dispatch deploy to xema-deploy
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.XEMA_DEPLOY_DISPATCH_TOKEN }}
          repository: ${{ env.DEPLOY_REPO }}
          event-type: deploy-service
          client-payload: |
            {
              "deployment": "xema-prod",
              "service": "${{ env.SERVICE }}",
              "image": "${{ steps.img.outputs.image }}",
              "tag": "${{ steps.img.outputs.tag }}",
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}"
            }
